name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Plugins
        run: |
          cd main
          chmod +x gradlew
          ./gradlew make makePluginsJson
          
          # Clean old files in builds directory keeping .git
          find ../builds -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          
          # Copy outputs to builds root directory
          cp SmartSub/build/*.cs3 ../builds/
          cp build/plugins.json ../builds/
          cp repo.json ../builds/

      - name: Push to builds
        run: |
          cd builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update builds [skip ci]" || exit 0
          git push origin builds
